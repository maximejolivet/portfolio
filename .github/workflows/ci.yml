name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - run: sfw npm ci

      - run: npm run lint

      - run: npm run test

  sonarqube:
    name: SonarQube Cloud
    needs: lint-test
    runs-on: ubuntu-latest
    # Skip on forked PRs: SONAR_TOKEN secret isn't exposed to fork workflows
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # SonarQube needs full history for accurate new-code/blame analysis

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - run: sfw npm ci

      # Own job/runner from lint-test, so the coverage report has to be
      # regenerated here too - it's not shared across jobs without an
      # explicit artifact upload/download, and the scan action below reads
      # it straight off this runner's filesystem (sonar.javascript.lcov.reportPaths).
      - run: npm run test:coverage

      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
