# SonarQube Cloud project config — see https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/analysis-parameters/
# NOTE: adjust sonar.organization / sonar.projectKey to match what SonarQube Cloud assigns
# when you import this repo (Sonarqube Cloud > + > Analyze new project > GitHub).
sonar.organization=maximejolivet
sonar.projectKey=maximejolivet_portfolio

sonar.sources=.
sonar.tests=test
sonar.test.inclusions=test/**/*.spec.ts

sonar.exclusions=node_modules/**,.nuxt/**,.nitro/**,.output/**,.cache/**,dist/**,coverage/**,public/**,utils/generated/**,docs/**,.codegraph/**
